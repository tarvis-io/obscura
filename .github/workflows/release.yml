name: Tarvis Linux binaries

on:
  pull_request:
  push:
    tags: ['v*-tarvis.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev libssl-dev llvm-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.100.0'
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: nextest
          fallback: none
      - name: Focused network tests
        run: cargo nextest run --locked --release -p obscura-ssrf -p obscura-net
      - name: Full render tests
        run: cargo nextest run --locked --release --features render --no-fail-fast
      - name: Build release binaries
        run: cargo build --locked --release -p obscura-cli --bins --features render
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: h4ckf0r0day/obscura-benchmark
          ref: 2d08d9a8e860e423b47209434a9fba9c75e6eee6
          path: obscura-benchmark
          persist-credentials: false
      - name: Require 33 passing obstacle stages
        run: |
          OBSCURA_BIN="$GITHUB_WORKSPACE/target/release/obscura" python3 obscura-benchmark/obstacle-course/run.py --json --runs 1 --warmup 0 > obstacle.json
          python3 scripts/ci/compare_obstacle.py --base obstacle.json --candidate obstacle.json
      - name: Package binaries and provenance
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p package dist
          cp target/release/obscura target/release/obscura-worker LICENSE TARVIS.md package/
          printf '%s\n' "$GITHUB_SHA" > package/SOURCE_COMMIT
          tar -czf "dist/obscura-${ARCH}-linux.tar.gz" -C package .
          cd dist
          sha256sum "obscura-${ARCH}-linux.tar.gz" > "obscura-${ARCH}-linux.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: obstacle-${{ matrix.arch }}
          path: obstacle.json
          if-no-files-found: ignore
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c ./*.sha256
          gh release create "$RELEASE_TAG" ./* --verify-tag --title "Obscura $RELEASE_TAG" --notes "Tarvis exact-origin workspace access. Linux ARM64 and AMD64 render binaries; source revision and Apache license included."
